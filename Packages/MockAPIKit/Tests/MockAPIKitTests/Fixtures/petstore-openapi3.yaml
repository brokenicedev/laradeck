openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
servers:
  - url: https://{env}.petstore.test/api/{version}
    variables:
      env: { default: sandbox }
      version: { default: v1 }
paths:
  /pets:
    get:
      summary: List pets
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: A list of pets
          headers:
            X-Total-Count:
              schema: { type: integer }
              example: 2
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pet' }
        default:
          description: Unexpected error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      summary: Create a pet
      responses:
        '201':
          description: Created
          content:
            application/json:
              examples:
                dog:
                  summary: A dog
                  value: { id: 10, name: Rex, tag: dog }
                cat:
                  value: { id: 11, name: Tom, tag: cat }
        '422':
          description: Validation error
          content:
            application/json:
              example: { message: The name field is required. }
  /pets/{petId}:
    get:
      operationId: showPetById
      responses:
        '200':
          description: One pet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pet' }
        '404':
          description: Not found
    delete:
      responses:
        '204':
          description: Deleted
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Fido }
        tag: { type: string, enum: [dog, cat] }
        owner_email: { type: string, format: email }
        born_at: { type: string, format: date-time }
        category: { $ref: '#/components/schemas/Category' }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        parent: { $ref: '#/components/schemas/Category' }
    Error:
      allOf:
        - type: object
          properties:
            code: { type: integer, example: 500 }
        - type: object
          properties:
            message: { type: string }
