			name = "Strip Sparkle for App Store";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Strip Sparkle from Mac App Store builds (ITMS-90296 / no third-party updaters).\nif echo \"$CONFIGURATION\" | grep -q AppStore; then\n  for BASE in \"${TARGET_BUILD_DIR}\" \"${BUILT_PRODUCTS_DIR}\"; do\n    SPARKLE=\"${BASE}/${FRAMEWORKS_FOLDER_PATH}/Sparkle.framework\"\n    if [ -d \"$SPARKLE\" ]; then\n      echo \"note: Removing Sparkle.framework from $SPARKLE\"\n      rm -rf \"$SPARKLE\"\n    fi\n  done\n  # Fail the build if Sparkle is still embedded — ASC rejects it.\n  for BASE in \"${TARGET_BUILD_DIR}\" \"${BUILT_PRODUCTS_DIR}\"; do\n    SPARKLE=\"${BASE}/${FRAMEWORKS_FOLDER_PATH}/Sparkle.framework\"\n    if [ -d \"$SPARKLE\" ]; then\n      echo \"error: Sparkle.framework still present at $SPARKLE — App Store builds must not include Sparkle\"\n      exit 1\n    fi\n  done\n  echo \"note: Sparkle absent (OK for App Store)\"\nfi\n";
		};
/* End PBXShellScriptBuildPhase section */

